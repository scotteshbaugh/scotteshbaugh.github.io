<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pullout component preview</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/fonts.css">
<script type="module" src="pullout.js"></script>
<style>
  /* preview-page-only styling, not part of the component */
  body { margin: 0; padding: 32px; background: #ffffff; font-family: sans-serif; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: #6f6f6f; margin: 32px 0 12px; }
  h2:first-of-type { margin-top: 0; }
  .note { max-width: 900px; margin: 0 0 32px; padding: 12px 16px; background: #f4f4f4; border-radius: 4px; font-size: 13px; color: #525252; line-height: 1.5; }
  .row { max-width: 528px; }
</style>
</head>
<body>

<p class="note">Resize below 720px to see the Mobile (Heading 4) size step up to Heading 3 at Tablet/Desktop.</p>

<h2>Statement</h2>
<div class="row">
  <ds-pullout>
    <span slot="header">Title about something or someone.</span>
  </ds-pullout>
</div>

<h2>Quote</h2>
<div class="row">
  <ds-pullout type="quote">
    <span slot="header">Quote about something or someone.</span>
    <span slot="attribution">Person</span>
  </ds-pullout>
</div>

</body>
</html>
