<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case study — Scott Eshbaugh</title>
<link rel="icon" type="image/svg+xml" href="assets/se-logomark.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/case-study.css">
<script type="module" src="case-study.js"></script>
<script type="module" src="components/divider.js"></script>
<script type="module" src="components/image.js"></script>
<script type="module" src="components/icon.js"></script>
</head>
<body>

<header class="site-nav">
  <a class="site-nav__logo" href="./" aria-label="Home">
    <img src="assets/se-logomark.svg" alt="" width="44" height="44">
  </a>
  <nav class="site-nav__links" aria-label="Primary">
    <a class="link" href="assets/documents/software-product-design-resume_eshbaugh_2026-10.pdf" target="_blank" rel="noopener">Resume</a>
  </nav>
</header>

<main class="content">
  <div class="case-study-header">
    <h1 class="case-study-header__heading"></h1>
    <p class="case-study-header__body"></p>
  </div>

  <ds-summary></ds-summary>

  <section class="case-study-context">
    <div class="section-divider">
      <p class="section-divider__label">Context</p>
      <ds-divider size="medium"></ds-divider>
    </div>
    <div class="case-study-context__grid">
      <ds-pullout></ds-pullout>
      <ds-list layout="stack" variant="primary" numbered></ds-list>

    </div>
  </section>
  <!-- Solution. The arrangement lives here, from Figma (page node 563:17491):
       which layout each subsection uses, which showcase is single and
       which is split, and each panel's span. The words and image paths
       come from data/case-studies/predictive-customer-analytics.json, matched up by
       subsection order and showcase letter. -->
  <section class="case-study-section">
    <div class="section-divider">
      <p class="section-divider__label">Solution</p>
      <ds-divider size="medium"></ds-divider>
    </div>

    <div class="case-study-section__subsections">

      <!-- 01 Subsection -- Single, None -->
      <div class="layout layout--single-none">
        <div class="subhead layout__subhead">
          <ds-divider emphasis="strong"></ds-divider>
          <h2 class="subhead__heading"></h2>
        </div>

        <div class="showcase showcase--single layout__showcase-a">
          <ds-image><img alt=""></ds-image>
        </div>
      </div>

      <!-- 02 Subsection -- Side by Side, Above -->
      <div class="layout layout--side-by-side-above">
        <div class="subhead layout__subhead">
          <ds-divider emphasis="strong"></ds-divider>
          <h2 class="subhead__heading"></h2>
        </div>

        <div class="showcase showcase--single layout__showcase-a">
          <ds-image><img alt=""></ds-image>
        </div>
        <div class="figure-caption layout__caption-a">
          <p class="figure-caption__title"></p>
          <p class="figure-caption__body"></p>
        </div>

        <div class="showcase showcase--single layout__showcase-b">
          <ds-image><img alt=""></ds-image>
        </div>
        <div class="figure-caption layout__caption-b">
          <p class="figure-caption__title"></p>
          <p class="figure-caption__body"></p>
        </div>
      </div>

      <!-- 03 Subsection -- Single, None -->
      <div class="layout layout--single-none">
        <div class="subhead layout__subhead">
          <ds-divider emphasis="strong"></ds-divider>
          <h2 class="subhead__heading"></h2>
        </div>

        <div class="showcase showcase--single layout__showcase-a">
          <ds-image><img alt=""></ds-image>
        </div>
      </div>

      <!-- 04 Subsection -- Single, None -->
      <div class="layout layout--single-none">
        <div class="subhead layout__subhead">
          <ds-divider emphasis="strong"></ds-divider>
          <h2 class="subhead__heading"></h2>
        </div>

        <div class="showcase showcase--single layout__showcase-a">
          <ds-image><img alt=""></ds-image>
        </div>
      </div>

    </div>
  </section>

  <!-- Process (Figma node 563:17504). Pullout Layout: statement,
       description and the action on the left; a showcase on the right,
       still empty in Figma. -->
  <section class="case-study-section">
    <div class="section-divider">
      <p class="section-divider__label">Process</p>
      <ds-divider size="medium"></ds-divider>
    </div>
    <div class="pullout-layout">
      <div class="pullout-layout__pullout">
        <div class="pullout-layout__statement">
          <ds-pullout></ds-pullout>
          <p class="pullout-layout__description"></p>
        </div>
        <a class="pullout-layout__action" href="">
          <span></span>
          <ds-icon name="external-link" size="16"></ds-icon>
        </a>
      </div>
    </div>
  </section>

  <!-- Outcome (Figma page node 563:17491). Pullout Layout: the quote and its
       attribution on the left, the numbered points on the right. -->
  <section class="case-study-section">
    <div class="section-divider">
      <p class="section-divider__label">Outcome</p>
      <ds-divider size="medium"></ds-divider>
    </div>
    <div class="pullout-layout">
      <div class="pullout-layout__pullout">
        <ds-pullout type="quote"></ds-pullout>
      </div>
      <ds-list class="pullout-layout__support" layout="stack" variant="primary" numbered></ds-list>
    </div>
  </section>
</main>

</body>
</html>
